
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velora - Product Store</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8f5f0;
            color: #333;
        }

        header {
            background: #594637;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            font-family: Georgia, serif;
            letter-spacing: 2px;
        }

        header p {
            margin-top: 8px;
            color: #e8ddd0;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 40px auto;
        }

        .container h2 {
            text-align: center;
            margin-bottom: 30px;
            font-family: Georgia, serif;
            font-size: 30px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .product-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 12px #00000015;
            transition: 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 18px #00000025;
        }

        .product-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .product-info {
            padding: 18px;
            text-align: center;
        }

        .product-info h3 {
            margin-bottom: 10px;
        }

        .price {
            color: #76543d;
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        button {
            background: #594637;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #8a6b50;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #e9e0d5;
            margin-top: 40px;
        }

        /* Responsive design */
        @media (max-width: 750px) {
            .product-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .product-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>VELORA</h1>
        <p>Simple Things, Beautiful Living</p>
    </header>

    <div class="container">
        <h2>Our Products</h2>

        <div class="product-grid">

            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1548036328-c9fa89d128fa?w=500"
                     alt="Handbag">
                <div class="product-info">
                    <h3>Classic Handbag</h3>
                    <p class="price">₹1,499</p>
                    <button type="button">Buy Now</button>
                </div>
            </div>

            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=500"
                     alt="Sunglasses">
                <div class="product-info">
                    <h3>Retro Sunglasses</h3>
                    <p class="price">₹799</p>
                    <button type="button">Buy Now</button>
                </div>
            </div>

            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500"
                     alt="Watch">
                <div class="product-info">
                    <h3>Classic Watch</h3>
                    <p class="price">₹1,999</p>
                    <button type="button">Buy Now</button>
                </div>
            </div>

        </div>
    </div>

    <footer>
        <p>© 2026 Velora | All Rights Reserved</p>
    </footer>

</body>
</html>
